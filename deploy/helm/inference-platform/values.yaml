frontend:
  replicaCount: 1
  image:
    repository: frontend
    tag: latest
    pullPolicy: Never
  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30007

gateway:
  replicaCount: 1
  image:
    repository: gateway
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000

mediaService:
  image:
    repository: media-service
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 7000
    targetPort: 7000

worker:
  image:
    repository: worker
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 6000
    targetPort: 6000

storage:

  datasets:
    size: 5Gi
    mountPath: /data/datasets
    accessModes:
      - ReadOnlyMany

  mediaFiles:
    size: 2Gi
    mountPath: /data/media_files
    accessModes:
      - ReadWriteMany

  weights:
    size: 20Gi
    mountPath: /data/weights
    accessModes:
      - ReadOnlyMany
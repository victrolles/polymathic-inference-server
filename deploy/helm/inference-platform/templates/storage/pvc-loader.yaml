{{- if .Values.pvcLoader.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: pvc-loader
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      volumeMounts:
        - name: datasets
          mountPath: {{ $.Values.storage.datasets.mountPath | quote }}
        - name: weights
          mountPath: {{ $.Values.storage.weights.mountPath | quote }}
  volumes:
    - name: datasets
      persistentVolumeClaim:
        claimName: {{ include "inference-platform.datasets.name" $ | quote }}
    - name: weights
      persistentVolumeClaim:
        claimName: {{ include "inference-platform.weights.name" $ | quote }}
{{- end }}
{{- if .Values.worker.enabled }}
{{- $models := include "inference-platform.discoveredModels" $ | fromYamlArray }}
{{- range $_, $model := $models }}
{{- if index $model "enabled" }}
{{- range $_, $size := (index $model "sizes") | default list }}
{{- if index $size "enabled" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference-platform.worker.service" (dict "root" $ "modelName" (index $model "name") "sizeName" (index $size "name")) | quote }}
spec:
  type: {{ $.Values.worker.service.type }}
  selector:
    app: {{ include "inference-platform.worker.name" (dict "root" $ "modelName" (index $model "name") "sizeName" (index $size "name")) | quote }}
  ports:
    - port: {{ $.Values.worker.service.port }}
      targetPort: {{ $.Values.worker.service.targetPort }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
model:
  id: aion
  name: AION
  enabled: false

sizes:
  - id: aion-base
    name: AION Base
    path: "/mnt/home/vgoudal/ceph/huggingface/models/polymathic-ai/aion-base"
    enabled_gpu: true
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m

data_types:
  - id: rgb-pil
    kind: image
    representation: pil_image

  - id: rgb-pil-list
    kind: list
    element_type:
      data_type_id: rgb-pil

  - id: prediction-dict
    kind: dictionary

  - id: plot-prediction
    kind: image
    representation: matplotlib_figure

  - id: legacy-survey-dict
    kind: dictionary
    fields:
      - id: rgb
        data_type_id: rgb-pil

  - id: legacy-survey-dict-list
    kind: list
    element_type:
      data_type_id: legacy-survey-dict

visualizers:
  - id: prediction_tensor_to_plot
    function_name: prediction_tensor_to_plot
    input_data_type_id: prediction-dict
    output_data_type_id: plot-prediction
    output_modalities: [plot]

datasets:
  - id: legacy-survey
    name: Legacy Survey
    path: "/mnt/home/vgoudal/aion-inference/datasets/MultimodalUniverse/legacysurvey/subset_1000"
    checkpoint_format: huggingface
    data_type_id: legacy-survey-dict-list

modalities:
  - id: rgb
    name: RGB Image
    data_type_id: rgb-pil

  - id: plot
    name: Plot
    data_type_id: plot-prediction

tasks:
  - id: redshift-prediction
    name: Redshift Prediction
    data_samples:
      modality_id: rgb
      multiple_data_selection: true

    selected_data_samples:
      display: false

    data_outputs:
      modality_id: plot

    ui:
      text_top_screen: "Get redshift predictions for a set of images"
      data_size: { width: "200px", height: "200px" }
      output_data_size: { width: "40vh", height: "35vh" }
      submit_button_text: "Search Redshift Predictions"

    inference:
      input_data_type_id: legacy-survey-dict-list
      output_data_type_id: prediction-dict

  - id: similarity-search
    name: Similarity Search
    data_samples:
      modality_id: rgb

    selected_data_samples:
      display: true
      modality_id: rgb

    data_outputs:
      display_multiple_results: true
      modality_id: rgb

    ui:
      text_top_screen: "Find objects with similar photometry and morphology"
      data_size: { width: "120px", height: "120px" }
      selected_data_size: { width: "25vh", height: "25vh" }
      output_data_size: { width: "25vh", height: "25vh" }
      submit_button_text: "Search Similarity"

    inference:
      input_data_type_id: legacy-survey-dict
      output_data_type_id: rgb-pil-list

information:
  extended_name: "AION-1: A billion-parameter multimodal foundation model for astronomy"
  date: "2025-12-16"
  short_description: "Semantic search across 140 million galaxy images using AI-generated captions."
  description: "Deep learning is everywhere in astronomy, but most models live in silos—built for one data type, one survey, and one bespoke task. As a result, they must be retrained whenever these settings change. The AstronomIcal Omnimodal Network (AION-1) changes this: a single foundation model that spans multiple surveys and data types, producing a unified representation that transfers across domains and performs strongly even in low-data regimes. By learning shared astrophysical structure across instruments and modalities, AION-1 not only removes the need for retraining—it enables better performance, faster adaptation, and a deeper physical understanding from fewer examples."
  authors: "Liam Parker, Francois Lanusse, Jeff Shen, Ollie Liu, Tom Hehir, Leopoldo Sarra, Lucas Meyer, Micah Bowles, Sebastian Wagner-Carena, Helen Qu, Siavash Golkar, Alberto Bietti, Hatim Bourfoune, Nathan Casserau, Pierre Cornette, Keiya Hirashima, Geraud Krawezik, Ruben Ohana, Nicholas Lourie, Michael McCabe, Rudy Morel, Payel Mukhopadhyay, Mariel Pettee, Bruno Regaldo-Saint Blancard, Kyunghyun Cho, Miles Cranmer, Shirley Ho"
  links:
    - name: "Github"
      url: "https://github.com/PolymathicAI/AION"
      alt: "AION-1 API and Code"
    - name: "Blog"
      url: "https://polymathic-ai.org/blog/aion-1/"
      alt: "AION-1"
    - name: "Paper"
      url: "https://arxiv.org/abs/2510.17960"
      alt: "AION-1: Omnimodal Foundation Model for Astronomical Sciences"
    - name: "Model Weights"
      url: "https://huggingface.co/polymathic-ai/aion-base"
      alt: "AION-1 Hugging Face"
    - name: "Tutorial"
      url: "https://colab.research.google.com/github/PolymathicAI/AION/blob/main/notebooks/Tutorial.ipynb"
      alt: "AION-1 quick start"
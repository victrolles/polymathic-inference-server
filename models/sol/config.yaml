model:
  id: sol
  name: SOL

sizes:
  - id: sol-base
    name: SOL Base

data_types:
  - id: x_tensor
    kind: tensor
    representation: torch_tensor
    shape: [C, F, H, W]

  - id: x_video
    kind: video
    representation: matplotlib_animation
    fps: 25
    dpi: 100

  - id: sol_dataset_dict
    kind: dictionary
    fields:
      - id: x_obs
        data_type_id: x_tensor

visualizers:
  - id: generate_video_from_tensor
    input:
      data_type_id: x_tensor
    output:
      data_type_id: x_video

inference:
  - id: sol-generation
    name: SOL Generation
    input:
      data_type_id: sol_dataset_dict
    output:
      data_type_id: x_tensor

datasets:
  - id: sol_dataset
    name: SOL Dataset
    path: /mnt/home/vgoudal/polymathic-inference/aion-inference/datasets/sol/dataset.pt
    checkpoint_format: torch_pt
    data_type_id: sol_dataset_dict

modalities:
  - id: br
    name: BR
    data_type_id: x_video

  - id: bp
    name: BP
    data_type_id: x_video

  - id: bt
    name: BT
    data_type_id: x_video

  - id: dopplergram
    name: Dopplergram
    data_type_id: x_video

  - id: continuum
    name: Continuum
    data_type_id: x_video

  - id: aia_1700
    name: AIA 1700
    data_type_id: x_video

  - id: aia_1600
    name: AIA 1600
    data_type_id: x_video

  - id: aia_0335
    name: AIA 0335
    data_type_id: x_video

  - id: aia_0304
    name: AIA 0304
    data_type_id: x_video

  - id: aia_0211
    name: AIA 0211
    data_type_id: x_video

  - id: aia_0193
    name: AIA 0193
    data_type_id: x_video

  - id: aia_0171
    name: AIA 0171
    data_type_id: x_video

  - id: aia_0131
    name: AIA 0131
    data_type_id: x_video

  - id: aia_0094
    name: AIA 0094
    data_type_id: x_video

tasks:
  - id: sun-prediction
    name: Sun Prediction

    data_samples:
      modality_id: aia_0304
      sample_size: 7

    selected_data_samples:
      display: true
      display_modalities_names: true
      display_multiple_modalities_simultaneously: true
      modality_ids: [aia_1700, aia_0304]

    data_outputs:
      display_multiple_modalities_simultaneously: true
      modality_ids: [br, aia_1700, aia_0304]
      enable_switch_modalities: true
      switch_modality_ids: [br, bp, bt, aia_1700, aia_0304]

    ui:
      text_top_screen: "Predict the sun's activity for a given video"
      data_size: { width: "120px", height: "120px" }
      selected_data_size: { width: "25vh", height: "25vh" }
      submit_button_text: "Predict Sun Activity"